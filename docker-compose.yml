version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension
  # ----------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: smart_attendance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smart_attendance}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_attendance}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis Cache & Pub/Sub
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: smart_attendance_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # FastAPI Backend API Server
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smart_attendance_backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-smart_attendance}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-smart_attendance}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_secure_random_string_in_production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Streamlit Admin Dashboard
  # ----------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: smart_attendance_dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    environment:
      - BACKEND_API_URL=http://backend:8000/api/v1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - backend
      - redis

  # ----------------------------------------------------------------------------
  # Video Processing Service (Detection, Recognition, Pub/Sub)
  # ----------------------------------------------------------------------------
  video_processor:
    build:
      context: .
      dockerfile: video_processor/Dockerfile
    container_name: smart_attendance_video_processor
    restart: unless-stopped
    environment:
      - BACKEND_API_URL=http://backend:8000/api/v1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEVICE=${DEVICE:-cpu}
      - ONNX_PROVIDER=${ONNX_PROVIDER:-CPUExecutionProvider}
      - FACE_MATCH_THRESHOLD=${FACE_MATCH_THRESHOLD:-0.50}
    depends_on:
      - backend
      - redis
    # --------------------------------------------------------------------------
    # GPU Configuration (Uncomment when NVIDIA GPU + nvidia-container-toolkit are installed)
    # --------------------------------------------------------------------------
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  postgres_data:
    name: smart_attendance_postgres_data
  redis_data:
    name: smart_attendance_redis_data
